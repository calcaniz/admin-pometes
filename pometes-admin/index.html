<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Pometes — Acceso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-bg">
    <!-- Decoración de fondo -->
    <div class="login-bg-shape shape-1"></div>
    <div class="login-bg-shape shape-2"></div>

    <div class="login-card">
        <!-- Logo -->
        <div class="login-logo">
            <div class="logo-icon">🏡</div>
            <div class="logo-text">
                <span class="logo-casa">Casa </span><span class="logo-pometes">Pometes</span>
            </div>
            <p class="logo-tagline">Comunitat Valenciana</p>
        </div>

        <div class="login-divider"></div>

        <p class="login-subtitle">Panel de administración privado</p>

        <!-- Formulario -->
        <form id="loginForm" class="login-form" novalidate>
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                    </span>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        autocomplete="email"
                        autofocus
                        required
                    >
                </div>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Introduce tu contraseña"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña" title="Mostrar/ocultar contraseña">
                        <!-- Icono ojo (visible cuando tipo=password) -->
                        <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <!-- Icono ojo tachado (visible cuando tipo=text) -->
                        <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Mensaje de error -->
            <div id="loginError" class="login-error" hidden>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span id="loginErrorMsg">Contraseña incorrecta. Inténtalo de nuevo.</span>
            </div>

            <!-- Botón submit -->
            <button type="submit" class="btn-login" id="btnLogin">
                <span class="btn-text">Acceder</span>
                <span class="btn-spinner" id="btnSpinner" hidden>
                    <svg class="spinner" width="20" height="20" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
                        <path d="M12 3a9 9 0 0 1 9 9" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
                    </svg>
                </span>
            </button>
        </form>

        <p class="login-footer">© 2026 La Llar de Pometes · Uso exclusivo del propietario</p>
    </div>
</div>

<script src="js/auth.js"></script>

</body>
</html>
